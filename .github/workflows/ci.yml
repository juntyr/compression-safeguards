name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

env:
  CLICOLOR: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Check with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check

  spelling:
    name: Spellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Spellcheck repo
        uses: crate-ci/typos@v1.40.0

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Check with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --diff --check"

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]
        markers: ["not slow and not veryslow", "slow", "veryslow"]
        exclude:
          - python: "3.11"
            markers: "veryslow"
            resolution: "highest"
          - python: "3.12"
            markers: "veryslow"
          - python: "3.13"
            markers: "veryslow"
          - python: "3.14"
            markers: "veryslow"
            resolution: "lowest-direct"
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Setup the Python venv with the safeguards
        run: |
          uv sync --all-packages \
            --group test \
            --resolution ${{ matrix.resolution }} \
            --no-build \
            --no-binary-package compression-safeguards \
            --no-binary-package numcodecs-safeguards \
            --no-binary-package xarray-safeguards \
            --no-binary-package varint

      - name: Run tests
        run: uv run pytest -v -W error -m "${{ matrix.markers }}"

  mypy:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Setup the Python venv with the safeguards
        run: |
          uv sync --all-packages \
            --group typing \
            --resolution ${{ matrix.resolution }} \
            --no-build \
            --no-binary-package compression-safeguards \
            --no-binary-package numcodecs-safeguards \
            --no-binary-package xarray-safeguards \
            --no-binary-package varint

      - name: Typecheck compression-safeguards
        run: uv run mypy -p compression_safeguards

      - name: Typecheck numcodecs-safeguards
        run: cd packages/numcodecs-safeguards && uv run mypy -p numcodecs_safeguards

      - name: Typecheck xarray-safeguards
        run: cd packages/xarray-safeguards && uv run mypy -p xarray_safeguards

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]
        exclude:
          - python: "3.12"
            resolution: "lowest-direct"
          - python: "3.13"
            resolution: "lowest-direct"
          - python: "3.14"
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Setup the Python venv with the safeguards
        run: |
          uv sync --all-packages \
            --group fuzz \
            --resolution ${{ matrix.resolution }} \
            --no-build \
            --no-binary-package compression-safeguards \
            --no-binary-package numcodecs-safeguards \
            --no-binary-package xarray-safeguards \
            --no-binary-package varint

      - name: Restore the fuzzer corpus
        id: fuzzer-corpus-restore
        uses: actions/cache/restore@v5
        with:
          path: ./corpus
          key: fuzzer-corpus

      - name: Ensure the fuzzer corpus exists
        run: |
          mkdir -p ./corpus/safeguards
          mkdir -p ./corpus/intervals
          mkdir -p ./corpus/qois
          mkdir -p ./corpus/chunking

      - name: Run the fuzzers
        run: |
          uv run fuzz/fuzz_safeguards.py ./corpus/safeguards -max_total_time=60
          uv run fuzz/fuzz_intervals.py ./corpus/intervals -max_total_time=30
          uv run fuzz/fuzz_qois.py ./corpus/qois -max_total_time=60
          uv run fuzz/fuzz_chunking.py ./corpus/chunking -max_total_time=30

      - name: Delete the previous fuzzer corpus
        if: always() && steps.fuzzer-corpus-restore.outputs.cache-hit == 'true'
        run: gh cache delete fuzzer-corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the fuzzer corpus
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ./corpus
          key: fuzzer-corpus

  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup the Python venv with the safeguards
        run: |
          uv sync --all-packages \
            --resolution highest \
            --no-build \
            --no-binary-package compression-safeguards \
            --no-binary-package numcodecs-safeguards \
            --no-binary-package xarray-safeguards \
            --no-binary-package varint

      - name: Install mkdocs dependencies
        run: uv pip install -r docs/requirements.txt

      # https://github.com/mkdocstrings/python/issues/167
      - name: Reduce docs duplication
        run: sed -i 's/__all__ = \["Safeguards", "SafeguardKind"\]/__all__ = \[\]/g' src/compression_safeguards/__init__.py

      - name: Check docs build
        run: uv run mkdocs build

  doctest:
    name: Doctest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Setup the Python venv with the safeguards
        run: |
          uv sync --all-packages \
            --group doctest \
            --resolution ${{ matrix.resolution }} \
            --no-build \
            --no-binary-package compression-safeguards \
            --no-binary-package numcodecs-safeguards \
            --no-binary-package xarray-safeguards \
            --no-binary-package varint

      - name: Compile all docs
        run: |
          cp README.md docs/
          uv run griffe2md src/compression_safeguards/ -o docs/compression_safeguards.md
          uv run griffe2md packages/numcodecs-safeguards/src/numcodecs_safeguards/ -o docs/numcodecs_safeguards.md
          uv run griffe2md packages/xarray-safeguards/src/xarray_safeguards/ -o docs/xarray_safeguards.md
          find docs -type f -name "*.md" | xargs sed -i -e 's/```py/```python/g'

      - name: Run doctests
        run: uv run pytest -v -W error --codeblocks docs/

  pyodide-test:
    name: Test Pyodide
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13.2

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pyodide-build
        run: python -m pip install pyodide-build

      - name: Install the Pyodide build env
        run: pyodide xbuildenv install 0.29.0

      - name: Build the safeguards packages for Pyodide
        run: |
          pyodide build .
          pyodide build packages/numcodecs-safeguards
          pyodide build packages/xarray-safeguards

      - name: Build compiled dependencies for Pyodide
        run: |
          source "${EMSDK}/emsdk_env.sh"
          pyodide build-recipes \
            --recipe-dir tools/ci/pyodide-recipes/packages \
            --install \
            google-crc32c numcodecs numpy numpy-quaddtype varint

      - name: Create the Pyodide venv
        run: |
          # Set up Pyodide venv
          pyodide venv .venv-pyodide
          source .venv-pyodide/bin/activate
          # Install pre-built packages
          pip install $(ls dist/*.whl)
          # Install test dependencies
          pip install --group test

      - name: Run the fast tests for Pyodide
        run: |
          source .venv-pyodide/bin/activate
          python -m pytest -v -W error -m "not slow and not veryslow"

      - name: Run the slow tests for Pyodide
        run: |
          source .venv-pyodide/bin/activate
          python -m pytest -v -W error -m slow

      - name: Run the very slow tests for Pyodide
        run: |
          source .venv-pyodide/bin/activate
          python -m pytest -v -W error -m veryslow
