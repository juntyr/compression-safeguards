version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    post_checkout:
      - grep "__all__" src/compression_safeguards/__init__.py
      - sed -i "s/__all__ = \["\""Safeguards"\"", "\""SafeguardKind"\""\]/__all__ = \[\]/g" src/compression_safeguards/__init__.py
      - grep "__all__" src/compression_safeguards/__init__.py
      - git update-index --assume-unchanged src/compression_safeguards/__init__.py
      - grep "main" mkdocs.yml
      - sed -i "s/main/${READTHEDOCS_GIT_IDENTIFIER}/g" mkdocs.yml
      - grep "edit_uri" mkdocs.yml
      - git update-index --assume-unchanged mkdocs.yml
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --all-packages --group docs --link-mode=copy

mkdocs:
  configuration: mkdocs.yml
